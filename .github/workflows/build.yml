name: Build WDM Driver

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Compile Driver
      shell: pwsh
      run: |
        $wdkRoot = "C:\Program Files (x86)\Windows Kits\10"
        
        # Find the WDK version that actually has ntifs.h
        $v = (Get-ChildItem "$wdkRoot\Include" -Directory | Where-Object { Test-Path "$($_.FullName)\km\ntifs.h" } | Sort-Object Name -Descending | Select-Object -First 1).Name
        Write-Host "Using WDK Version: $v"
        
        $inc = "$wdkRoot\Include\$v"
        $lib = "$wdkRoot\Lib\$v"
        
        # Compile with explicit /I include paths
        cl.exe /c /GS- /kernel /I "$inc\km" /I "$inc\shared" /I "$inc\ucrt" inteldrv.c
        
        # Link with explicit paths to ntoskrnl.lib and wdmsec.lib
        link.exe /DRIVER /SUBSYSTEM:NATIVE /OUT:inteldrv.sys inteldrv.obj "$lib\km\x64\ntoskrnl.lib" "$lib\km\x64\wdmsec.lib"

    - name: Upload Driver
      uses: actions/upload-artifact@v4
      with:
        name: inteldrv
        path: inteldrv.sys
