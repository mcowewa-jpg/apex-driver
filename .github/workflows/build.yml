name: Build WDM Driver

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Compile Driver
      shell: pwsh
      run: |
        # Find the latest WDK version installed on the runner
        $wdkRoot = "C:\Program Files (x86)\Windows Kits\10"
        $latestVersion = (Get-ChildItem "$wdkRoot\Include" -Directory | Sort-Object Name -Descending | Select-Object -First 1).Name
        Write-Host "Using WDK Version: $latestVersion"

        # Add WDK paths to the compiler and linker
        $env:INCLUDE = "$wdkRoot\Include\$latestVersion\km;$wdkRoot\Include\$latestVersion\shared;$wdkRoot\Include\$latestVersion\ucrt;$env:INCLUDE"
        $env:LIB = "$wdkRoot\Lib\$latestVersion\km\x64;$wdkRoot\Lib\$latestVersion\ucrt\x64;$env:LIB"

        # Compile the C file
        cl.exe /c /GS- /kernel inteldrv.c

        # Link the object file into a .sys driver
        # /DRIVER indicates it's a kernel driver
        # /SUBSYSTEM:NATIVE sets the Windows Native subsystem
        # /ENTRY:GsDriverEntry is not needed since we use DriverEntry
        link.exe /DRIVER /SUBSYSTEM:NATIVE /OUT:inteldrv.sys inteldrv.obj

    - name: Upload Driver
      uses: actions/upload-artifact@v4
      with:
        name: inteldrv
        path: inteldrv.sys
